name: Tests

# Trigger on anything the suite actually exercises: the pipeline package,
# the scripts/ helpers (validate_gazetteers.py runs below, and tests import
# from scripts/), the gazetteer data, the tests themselves, the dependency
# pins, and this workflow file.
on:
  push:
    paths:
      - 'pipeline/**'
      - 'scripts/**'
      - 'gazetteers/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'pipeline/**'
      - 'scripts/**'
      - 'gazetteers/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'

# Read-only: this workflow only checks out and runs tests.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: PYTHONPATH=. python -m pytest tests/ -v --tb=short

      - name: Validate gazetteers
        run: PYTHONPATH=. python scripts/validate_gazetteers.py
